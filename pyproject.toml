# -------------------------------
# build-system
# -------------------------------
[build-system]
requires = [
    "setuptools>=61.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

# -------------------------------
# project (PEP 621 metadata)
# -------------------------------
[project]
name = "verl"
# We'll mark the version as "dynamic" because it's read from the file "verl/version/version" 
# (PEP 621 calls this "dynamic version"). 
# The actual version is specified in the [tool.setuptools.dynamic] section below.
dynamic = ["version", "dependencies", "optional-dependencies", "authors", "urls"]

description = "verl: Volcano Engine Reinforcement Learning for LLM"
license = {text = "Apache-2.0"}  # Changed from file to text format
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"

# -------------------------------
# tool.ruff - Linting configuration
# -------------------------------
[tool.ruff]
# Note: While the formatter will attempt to format lines such that they remain within the line-length,
# it isn't a hard upper bound, and formatted lines may exceed the line-length.
line-length = 120
# `recipes/design/grader_service` is a vendored snapshot of a service maintained in its own
# repo, not code maintained here. Reformatting it would turn every re-sync into a merge
# against a few hundred lint fixes instead of an overwrite. It is linted upstream.
exclude = ["scripts/legacy_model_merger.py", "recipes/design/grader_service"]

[tool.ruff.lint]
isort = {known-first-party = ["verl"]}
# c.f. https://github.com/vllm-project/vllm/blob/ce8d6b75fc0586045df75ee1568a5b5f9957251b/pyproject.toml
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # isort
    "I",
    "G",
]
ignore = [
    # star imports
    "F405", "F403",
    # lambda expression assignment
    "E731",
    # Loop control variable not used within loop body
    "B007",
    # f-string format
    "UP032",
    # `.log()` statement uses f-string
    "G004",
    # X | None for type annotations
    "UP045",
    # deprecated import
    "UP035",
]

[tool.ruff.lint.per-file-ignores]
# The web-dev arm's tool descriptions are prompt text: the policy reads them on
# every turn, so they are ported byte-for-byte from the run being reproduced.
# They live inside triple-quoted f-strings, where a long line cannot be wrapped
# without inserting a newline into the description itself -- which would change
# the prompt. tests/recipes/design/ guards the content by comparing the whole
# generated tool schema against the reference, so the bytes cannot drift
# unnoticed just because the line length is not checked here.
"recipes/design/webdev/tools/*.py" = ["E501"]

# The general arm's catalogue is the same case and the same upstream source: the
# capitalized Claude-Code tool descriptions, read by the policy on every turn and copied
# byte-for-byte from the run being reproduced. Wrapping a line inside one of those
# triple-quoted descriptions changes what the model sees.
"recipes/general/tools/*.py" = ["E501"]

# The evaluation rubric is the same case, one step more literal: its band descriptions and
# prompt template ARE the scoring ruler, handed to the judge model verbatim. Wrapping a line
# would insert a newline into the prompt, which measures something else and makes every
# published number incomparable. A test pins the rendered prompt's sha256 for that reason,
# so an accidental edit fails loudly rather than shifting the reward distribution quietly.
"recipes/design/webdev/eval_rubric.py" = ["E501"]

# -------------------------------
# tool.mypy - typechecking config
# -------------------------------
[tool.mypy]
pretty            = true
ignore_missing_imports = true
explicit_package_bases = true
follow_imports = "skip"

# Blanket silence
ignore_errors = true

[[tool.mypy.overrides]]
module = [
"verl.trainer.config.algorithm",
"verl.trainer.ppo.core_algos",
"verl.trainer.ppo.reward",
"verl.workers.reward_manager",
"verl.workers.reward_manager.*",
]
ignore_errors = false

# -------------------------------
# tool.setuptools - Additional config
# -------------------------------
[tool.setuptools]
# True means `setuptools` will attempt to include all relevant files in package_data automatically.
# This corresponds to `include_package_data=True` in setup.py.
include-package-data = true

# We read the version from a file in 'verl/version/version'
[tool.setuptools.dynamic]
version = {file = "verl/version/version"}

# If you need to mimic `package_dir={'': '.'}`:
[tool.setuptools.package-dir]
"" = "."

# If you need to include specific non-Python data (like YAML files or version file):
# This is the rough equivalent of package_data={'': ['version/*'], 'verl': ['trainer/config/*.yaml']}
[tool.setuptools.package-data]
verl = [
  "version/*",
  "trainer/config/*.yaml",
  "trainer/config/*/*.yaml",
  "experimental/*/config/*.yaml",
]
