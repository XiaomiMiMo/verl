- name: webdev
  _target_: recipes.design.agent_loop.WebdevAgentLoop
  config_path: config/agent/design/webdev.yaml

  per_turn_max_tokens: 32768

  reward_timeout: ${oc.env:REWARD_TIMEOUT,1500}
  env_setup_timeout: ${oc.env:ENV_SETUP_TIMEOUT,900}

  fail_on_env_setup_error: ${oc.env:FAIL_ON_ENV_SETUP_ERROR,false}
  invalid_reward_for_infra: ${oc.env:INVALID_REWARD_FOR_INFRA,false}

  trajectory_timeout: ${oc.env:TRAJECTORY_TIMEOUT,0}

  env_num_cpus: ${oc.env:ENV_NUM_CPUS,0.125}
  agent_thread_pool_size: 64

  max_images_per_rollout: ${oc.env:WEBDEV_MAX_IMAGES,4}
  image_max_pixels: ${oc.env:WEBDEV_IMAGE_MAX_PIXELS,1048576}
