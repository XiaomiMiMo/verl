
hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_megatron_trainer
  - _self_

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: ???
    use_fused_kernels: false
    mtp:
      enable: false
      enable_train: false
      enable_rollout: false

  rollout:
    name: sglang
    mode: async
    nnodes: 0
    n_gpus_per_node: 8
    prompt_length: 16384
    response_length: 245760
    max_model_len: 262144
    temperature: 1.0
    top_p: 0.95
    top_k: -1
    do_sample: true
    load_format: auto
    n: 16
    tensor_model_parallel_size: 2
    data_parallel_size: 1
    gpu_memory_utilization: 0.78
    max_num_seqs: 64
    log_prob_micro_batch_size_per_gpu: 1
    calculate_log_probs: true
    enable_sleep_mode: true
    free_cache_engine: true
    engine_kwargs:
      sglang:
        kv_cache_dtype: fp8_e4m3
        mamba_scheduler_strategy: no_buffer
        log_level: error
    multi_turn:
      enable: true
      max_parallel_calls: 1
      format: qwen3_coder
    agent:
      num_workers: 128
      default_agent_loop: mimo_swe_agent

  actor:
    use_dynamic_bsz: false
    use_rollout_log_probs: true
    ppo_mini_batch_size: 64
    ppo_max_token_len_per_gpu: 262144
    ppo_micro_batch_size_per_gpu: 1
    use_kl_loss: false
    clip_ratio: 0.2
    loss_agg_mode: prompt-mean
    entropy_coeff: 0
    entropy_from_logits_with_chunking: true
    entropy_from_logits_chunk_size: 4096
    optim:
      lr: 1e-6
    megatron:
      param_offload: true
      grad_offload: true
      optimizer_offload: true
      tensor_model_parallel_size: 8
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      expert_model_parallel_size: 1
      use_mbridge: true
      vanilla_mbridge: false
      use_remove_padding: false
      override_transformer_config:
        recompute_granularity: full
        recompute_method: uniform
        recompute_num_layers: 1
        attention_backend: auto

  ref:
    log_prob_max_token_len_per_gpu: 262144
    megatron:
      param_offload: true
      tensor_model_parallel_size: 8
      pipeline_model_parallel_size: 1
      context_parallel_size: 1

data:
  train_files: ???
  val_files: ???
  prompt_key: prompt
  truncation: error
  max_prompt_length: 16384
  max_response_length: 245760
  train_batch_size: 64
  gen_batch_size: 1
  return_raw_chat: true
  filter_overlong_prompts: false
  custom_cls:
    path: null
    name: null

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: false
  use_kl_in_reward: false
  kl_ctrl:
    type: fixed
    kl_coef: 0.001
  filter_groups:
    enable: true
    metric: reward
    max_inflight_gen_batches: 2

reward:
  reward_manager:
    name: dapo

trainer:
  nnodes: 8
  n_gpus_per_node: 8
  total_epochs: 5
  total_training_steps: 300
  project_name: arvo_rl
  experiment_name: arvo_train
  logger:
    - console
    - tensorboard
  val_before_train: false
  test_freq: 999
  save_freq: 1
  max_actor_ckpt_to_keep: 1000
  resume_mode: disable
  use_v1: true
  v1:
    trainer_mode: colocate_async
    colocate_async:
      num_warmup_batches: 1
    sampler:
      max_off_policy_threshold: 8
      max_off_policy_strategy: drop
