
use_dataset_env: true

agent:
  type: cc-agent
  tools:
  - tool: Bash
    config:
      timeout: 60
  - tool: Read
  - tool: Write
  - tool: Edit
  - tool: Grep
  - tool: Glob
  system_template: 'You are an agent, your current working directory is {{cwd}}.


    You can use the tools available to you to interact with the computer to assist
    the user in completing tasks.

    '
  instance_template: '{{task}}

    '
  step_limit: 500
  cost_limit: 114514
  enable_subagents: false
  enable_skills: false
  antihack:
    enabled: true
    dummy_output: Permission denied. Resource unavailable.
    dummy_success: false
    llm_judge_enabled: false

environment:
  environment_class: recipes.general.general_agent.k8s_sidecar.SidecarKubernetesEnvironment
  cwd: /work/workspace
  timeout: 1800
  raise_on_transport_error: true
  cpu_request: '2'
  memory_request: 8Gi

  shared_volumes:
  - workspace
  - system-vol
  main_volume_mounts:
  - name: workspace
    mount_path: /work/workspace
  sidecars:
  - name: sidecar
    command:
    - sleep
    - infinity
    volume_mounts:
    - name: workspace
      mount_path: /work/workspace
      read_only: true
    - name: system-vol
      mount_path: /work/system

  env:
    http_proxy: ""
    HTTP_PROXY: ""
    https_proxy: ""
    HTTPS_PROXY: ""
    no_proxy: localhost,127.0.0.1,.svc.cluster.local
    NO_PROXY: localhost,127.0.0.1,.svc.cluster.local
  node_selector: {}
